<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
   <link rel="stylesheet" href="style.css"/>

   <title>Card de Resumo do Pedido</title>
</head>
<body>
<main class="card">
  <div class="img-box">
     <img src="images/illustration-hero.svg" alt="illustration-hero">
  </div>
     <div class="card-content">
      <h1>Order Summary</h1>
      <div class="card-body">
 <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
      device anywhere you like! </p>

       <div class="plan-box">
        <div class="plan-details-wrapper">
        <img src="images/icon-music.svg">

       <div class="plan-details">
     <span class="plan-title">Annual Plan</span>
     <span class="plan-price">$59.99/year</span>
        </div>
      </div>
          <a href="#" class="change">Change</a>
        </div>

           <button>Proceed to Payment</button>
           <button>Cancel Order</button>
           </div>
     </div>
            </main>
         </body>
       </html>
